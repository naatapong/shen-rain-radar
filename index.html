<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="ฝนตกที่นี่ไหม และอีกสองชั่วโมงข้างหน้าเป็นอย่างไร จากสถานีวัดน้ำฝน เรดาร์ และโมเดลพยากรณ์"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <!--
      iOS ignores the manifest icons and reads this instead, and it will not
      read an SVG here — an SVG apple-touch-icon leaves the home screen with a
      screenshot of the page instead of the icon.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shen Radar" />
    <title>SHEN RAIN RADAR</title>
    <!--
      Chrome fires beforeinstallprompt as soon as it has accepted the manifest,
      which can be before the bundle has parsed. Parking it here means the
      install button still appears when that happens.
    -->
    <script>
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__installPrompt = event;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
